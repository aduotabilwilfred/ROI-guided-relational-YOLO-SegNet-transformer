stages:
  prepare_raw:
    cmd: python src/data/prepare_btxrd.py --data-dir data/raw/actual_dataset --output-dir data/raw/BTXRD_yolo
    deps:
      - data/raw/actual_dataset
      - src/data/prepare_btxrd.py
    outs:
      - data/raw/BTXRD_yolo

  prepare_dataset:
    cmd: python src/data/prepare_dataset.py --data-dir data/raw/${dataset} --output-dir data/processed/${dataset} --target-size 512
    params:
      - dataset
    deps:
      - data/raw/${dataset}
      - src/data/prepare_dataset.py
    outs:
      - data/processed/${dataset}

  make_folds:
    cmd: python src/data/make_folds.py --data-dir data/raw/${dataset} --output outputs/folds/cv_manifest.csv --seed 42
    params:
      - dataset
    deps:
      - data/raw/${dataset}
      - src/data/make_folds.py
      - src/data/prepare_dataset.py
    outs:
      - outputs/folds/cv_manifest.csv
      - outputs/folds/cv_manifest.summary.json

  fold_calibration:
    cmd: python src/data/fold_calibration.py --manifest outputs/folds/cv_manifest.csv --output outputs/folds/fold_params.json --target-size 512 --sample-size 40 --agents 25 --iters 60
    deps:
      - outputs/folds/cv_manifest.csv
      - src/data/fold_calibration.py
      - src/data/osgdf_preprocessing.py
      - src/data/prepare_dataset.py
    outs:
      - outputs/folds/fold_params.json

  build_fold_ultralytics:
    cmd: python src/data/build_fold_ultralytics.py --manifest outputs/folds/cv_manifest.csv --fold-params outputs/folds/fold_params.json --output-dir outputs/ultralytics_folds --target-size 512 --class-names cancer
    params:
      - dataset
    deps:
      - outputs/folds/cv_manifest.csv
      - outputs/folds/fold_params.json
      - data/raw/${dataset}
      - src/data/build_fold_ultralytics.py
      - src/data/osgdf_preprocessing.py
      - src/data/prepare_dataset.py
    outs:
      - outputs/ultralytics_folds


  train_yoloseg:
    cmd: python src/models/train_yoloseg.py --folds-root outputs/ultralytics_folds --output runs/yoloseg_relational --epochs 50 --batch-size 8 --lr 1e-4 --image-size 512
    deps:
      - outputs/ultralytics_folds
      - src/models/train_yoloseg.py
      - src/models/yoloseg_relational.py
      - src/models/yolo_detection_loss.py
      - src/utils/losses.py
      - src/utils/allmlp_decoder.py
      - src/utils/bilra_attention.py
      - src/utils/roi_partition.py
      - src/utils/rtrb.py
    outs:
      - runs/yoloseg_relational


# Optional hyperparameter tuning. Not chained into the default flow: run
  # explicitly (dvc repro tune_fheo) only when you want to tune. Scores
  # candidates on the val subset, on fold_0. Depends on the detector weights.
  tune_fheo:
    cmd: python src/models/fheo.py --fold-dir outputs/ultralytics_folds/fold_0 --weights runs/segment_cv/fold_0/weights/best.pt --output outputs/fheo/best_params.json --population 8 --iterations 10 --eval-epochs 10 --device cuda
    deps:
      - outputs/ultralytics_folds/fold_0
      - runs/segment_cv/fold_0/weights/best.pt
      - src/models/fheo.py
      - src/models/train.py
      - src/models/train_handoff.py
      - src/models/model.py
      - src/utils/losses.py
      - src/utils/allmlp_decoder.py
      - src/utils/bilra_attention.py
      - src/utils/efficient_attention.py
      - src/utils/relational_head.py
      - src/utils/roi_partition.py
      - src/utils/roi_crop.py
      - src/utils/rtrb.py
    outs:
      - outputs/fheo/best_params.json